name: Community Phase 2 Review Fixes v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/community-phase2-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-community-parity-seo
          fetch-depth: 0

      - name: Stabilize web lifecycle and format mobile lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          web_path = Path("edutu-web-app/src/features/community/CommunityDmPage.tsx")
          web = web_path.read_text()

          old_import = 'import { useCallback, useEffect, useMemo, useState } from "react";'
          new_import = 'import { useCallback, useEffect, useMemo, useRef, useState } from "react";'
          if web.count(old_import) != 1:
              raise SystemExit("Web React import marker was not found exactly once")
          web = web.replace(old_import, new_import, 1)

          error_marker = '  const [error, setError] = useState<string | null>(null);\n'
          if web.count(error_marker) != 1:
              raise SystemExit("Web error-state marker was not found exactly once")
          web = web.replace(
              error_marker,
              error_marker + '  const conversationRef = useRef<DmConversationDetail | null>(null);\n',
              1,
          )

          web, reset_count = re.subn(
              r'(  useEffect\(\(\) => \{\n)(\s+setConversation\(null\);)',
              r'\1    conversationRef.current = null;\n\2',
              web,
              count=1,
          )
          if reset_count != 1:
              raise SystemExit(f"Web route reset effect was not found; matches={reset_count}")

          subscription_marker = '''  }, [id, load]);

          useEffect(() => {
            const unsubscribe = subscribeToDmMessages'''
          if web.count(subscription_marker) != 1:
              raise SystemExit("Web subscription boundary was not found exactly once")
          web = web.replace(
              subscription_marker,
              '''  }, [id, load]);

          useEffect(() => {
            conversationRef.current = conversation;
          }, [conversation]);

          useEffect(() => {
            const unsubscribe = subscribeToDmMessages''',
              1,
          )

          hydrate_marker = 'const hydrated = hydrateRealtimeMessage(event, userId, conversation);'
          if web.count(hydrate_marker) != 1:
              raise SystemExit("Web realtime hydration marker was not found exactly once")
          web = web.replace(
              hydrate_marker,
              'const hydrated = hydrateRealtimeMessage(event, userId, conversationRef.current);',
              1,
          )

          deps_start = web.find('  }, [\n    api,\n    conversation?.otherUser.avatarUrl,')
          if deps_start < 0:
              raise SystemExit("Web realtime dependency block start was not found")
          deps_end_marker = '    userId,\n  ]);'
          deps_end = web.find(deps_end_marker, deps_start)
          if deps_end < 0:
              raise SystemExit("Web realtime dependency block end was not found")
          deps_end += len(deps_end_marker)
          web = web[:deps_start] + '  }, [api, id, load, userId]);' + web[deps_end:]
          web_path.write_text(web)

          mobile_path = Path("edutumobile/app/(app)/discussions/dm/[id].tsx")
          mobile = mobile_path.read_text()
          start = mobile.find("  useFocusEffect(\n  useCallback(() => {")
          end_marker = "  }, [conversationId, getToken, load, userId]),\n);"
          if start < 0:
              raise SystemExit("Malformed mobile focus block start was not found")
          end = mobile.find(end_marker, start)
          if end < 0:
              raise SystemExit("Malformed mobile focus block end was not found")
          end += len(end_marker)

          formatted = '''  useFocusEffect(
            useCallback(() => {
              let active = true;
              screenActiveRef.current = true;
              let reconciliationTimer: ReturnType<typeof setTimeout> | undefined;

              if (!conversationId) {
                void load();
                return () => {
                  active = false;
                  screenActiveRef.current = false;
                  loadRequestVersion.current += 1;
                };
              }

              const unsubscribe = subscribeToDmMessages(
                conversationId,
                (event) => {
                  if (
                    !active ||
                    !screenActiveRef.current ||
                    event.conversationId !== activeConversationIdRef.current
                  ) return;

                  const hydrated = hydrateRealtimeDmMessage(
                    event,
                    userId,
                    conversationRef.current,
                  );
                  setMessages((current) => mergeDmMessages(current, [hydrated]));
                  setConversation((current) =>
                    current ? { ...current, lastMessageAt: event.createdAt } : current,
                  );

                  if (
                    event.senderId !== userId &&
                    event.id !== lastMarkedMessageId.current
                  ) {
                    lastMarkedMessageId.current = event.id;
                    void markDmConversationRead(conversationId, getToken).catch(() => {
                      if (lastMarkedMessageId.current === event.id) {
                        lastMarkedMessageId.current = null;
                      }
                    });
                  }
                },
              );

              const reconcile = async () => {
                await load();
                if (active) {
                  reconciliationTimer = setTimeout(
                    () => void reconcile(),
                    RECONCILIATION_INTERVAL_MS,
                  );
                }
              };
              void reconcile();

              return () => {
                active = false;
                screenActiveRef.current = false;
                if (reconciliationTimer) clearTimeout(reconciliationTimer);
                unsubscribe();
                loadRequestVersion.current += 1;
              };
            }, [conversationId, getToken, load, userId]),
          );'''
          mobile_path.write_text(mobile[:start] + formatted + mobile[end:])

          for workflow in (
              ".github/workflows/community-phase2-review-fixes.yml",
              ".github/workflows/community-phase2-review-fixes-v2.yml",
          ):
              Path(workflow).unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(community): close phase 2 lifecycle review gaps"
          git push origin HEAD:feat/web-community-parity-seo
