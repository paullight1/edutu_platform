name: PR 6 Card Slots Once

on:
  push:
    branches:
      - feat/opportunity-pipeline-pr6
    paths:
      - ".github/workflows/pr6-card-slots-once.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'paullight1/edutu_platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opportunity-pipeline-pr6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edutu-web-app/package-lock.json
      - working-directory: edutu-web-app
        run: npm ci
      - name: Add optional journey slots without changing defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("edutu-web-app/src/components/dashboard/DashboardOpportunityCard.tsx")
          text = path.read_text()
          text = text.replace(
              'import { CSSProperties, memo, MouseEvent } from "react";',
              'import { CSSProperties, memo, MouseEvent, type ReactNode } from "react";',
              1,
          )
          marker = '  onImageError?: (id: string) => void;\n}'
          replacement = (
              '  onImageError?: (id: string) => void;\n'
              '  statusSlot?: ReactNode;\n'
              '  metaSlot?: ReactNode;\n'
              '  actionSlot?: ReactNode;\n'
              '}'
          )
          if marker not in text:
              raise SystemExit('props marker missing')
          text = text.replace(marker, replacement, 1)
          marker = '    onImageError,\n  } = props;'
          replacement = (
              '    onImageError,\n'
              '    statusSlot,\n'
              '    metaSlot,\n'
              '    actionSlot,\n'
              '  } = props;'
          )
          if marker not in text:
              raise SystemExit('destructure marker missing')
          text = text.replace(marker, replacement, 1)
          marker = '  const titleClassName = compactVariant\n'
          addition = (
              '  const journeySlots =\n'
              '    statusSlot || metaSlot || actionSlot ? (\n'
              '      <div\n'
              '        className="relative z-20 mt-2 space-y-2"\n'
              '        onClick={(event) => event.stopPropagation()}\n'
              '        onKeyDown={(event) => event.stopPropagation()}\n'
              '      >\n'
              '        {statusSlot ? <div className="flex flex-wrap gap-2">{statusSlot}</div> : null}\n'
              '        {metaSlot}\n'
              '        {actionSlot ? <div className="flex flex-wrap gap-2">{actionSlot}</div> : null}\n'
              '      </div>\n'
              '    ) : null;\n\n'
          )
          if marker not in text:
              raise SystemExit('slot placement marker missing')
          text = text.replace(marker, addition + marker, 1)
          button_marker = '        <button\n          type="button"\n          aria-label={`Open ${opportunity.title}`}'
          count = text.count(button_marker)
          if count < 2:
              raise SystemExit(f'expected overlay button markers, found {count}')
          text = text.replace(button_marker, '        {journeySlots}\n\n' + button_marker)
          path.write_text(text)
          PY
      - name: Format touched web files
        working-directory: edutu-web-app
        run: >-
          npx prettier --write
          src/components/dashboard/DashboardOpportunityCard.tsx
          src/components/dashboard/DashboardOpportunityCard.test.tsx
          src/components/opportunity-path/JourneyStatusBadge.tsx
          src/components/opportunity-path/OpportunityDecisionMeta.tsx
          src/hooks/useOpportunityHome.ts
          src/hooks/useOpportunityHome.test.tsx
          src/hooks/useOpportunityJourney.ts
          src/hooks/useOpportunityJourney.test.tsx
          src/services/opportunityJourney.ts
          src/services/opportunityJourney.test.ts
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edutu-web-app/src
          git diff --cached --quiet || git commit -m "feat(web): add optional opportunity journey slots"
          git push origin HEAD:feat/opportunity-pipeline-pr6
