name: Community Phase 2 Format

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/community-phase2-format.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-community-parity-seo
          fetch-depth: 0

      - name: Normalize focused DM lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("edutumobile/app/(app)/discussions/dm/[id].tsx")
          text = path.read_text()
          start = text.find("  useFocusEffect(\n  useCallback(() => {")
          end_marker = "  }, [conversationId, getToken, load, userId]),\n);"
          if start < 0:
              raise SystemExit("Mobile focus block start was not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Mobile focus block end was not found")
          end += len(end_marker)

          lines = [
              "  useFocusEffect(",
              "    useCallback(() => {",
              "      let active = true;",
              "      screenActiveRef.current = true;",
              "      let reconciliationTimer: ReturnType<typeof setTimeout> | undefined;",
              "",
              "      if (!conversationId) {",
              "        void load();",
              "        return () => {",
              "          active = false;",
              "          screenActiveRef.current = false;",
              "          loadRequestVersion.current += 1;",
              "        };",
              "      }",
              "",
              "      const unsubscribe = subscribeToDmMessages(",
              "        conversationId,",
              "        (event) => {",
              "          if (",
              "            !active ||",
              "            !screenActiveRef.current ||",
              "            event.conversationId !== activeConversationIdRef.current",
              "          ) return;",
              "",
              "          const hydrated = hydrateRealtimeDmMessage(",
              "            event,",
              "            userId,",
              "            conversationRef.current,",
              "          );",
              "          setMessages((current) => mergeDmMessages(current, [hydrated]));",
              "          setConversation((current) =>",
              "            current ? { ...current, lastMessageAt: event.createdAt } : current,",
              "          );",
              "",
              "          if (",
              "            event.senderId !== userId &&",
              "            event.id !== lastMarkedMessageId.current",
              "          ) {",
              "            lastMarkedMessageId.current = event.id;",
              "            void markDmConversationRead(conversationId, getToken).catch(() => {",
              "              if (lastMarkedMessageId.current === event.id) {",
              "                lastMarkedMessageId.current = null;",
              "              }",
              "            });",
              "          }",
              "        },",
              "      );",
              "",
              "      const reconcile = async () => {",
              "        await load();",
              "        if (active) {",
              "          reconciliationTimer = setTimeout(",
              "            () => void reconcile(),",
              "            RECONCILIATION_INTERVAL_MS,",
              "          );",
              "        }",
              "      };",
              "      void reconcile();",
              "",
              "      return () => {",
              "        active = false;",
              "        screenActiveRef.current = false;",
              "        if (reconciliationTimer) clearTimeout(reconciliationTimer);",
              "        unsubscribe();",
              "        loadRequestVersion.current += 1;",
              "      };",
              "    }, [conversationId, getToken, load, userId]),",
              "  );",
          ]
          path.write_text(text[:start] + "\n".join(lines) + text[end:])
          Path(".github/workflows/community-phase2-format.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(community): format mobile DM realtime lifecycle"
          git push origin HEAD:feat/web-community-parity-seo
