name: PR 1 implementation resume

on:
  push:
    branches:
      - feat/opportunity-pipeline-pr1
    paths:
      - .github/workflows/pr1-resume.yml

permissions:
  contents: write

concurrency:
  group: opportunity-pipeline-pr1-resume
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'paullight1/edutu_platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/opportunity-pipeline-pr1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/services/services/api/package-lock.json
            edutu-web-app/package-lock.json
            admin/package-lock.json

      - name: Recover and validate implementation script
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/pr1-implementation.yml').read_text()
          match = re.search(r'encoded = """([A-Za-z0-9+/=]+)"""', workflow)
          if not match:
              raise SystemExit('Could not recover the PR 1 implementation payload')
          Path('scripts/pr1_apply.py').write_bytes(
              gzip.decompress(base64.b64decode(match.group(1)))
          )
          PY
          python -m py_compile scripts/pr1_apply.py

      - name: Apply PR 1 implementation
        run: python scripts/pr1_apply.py

      - name: Verify backend flags
        working-directory: backend/services/services/api
        run: |
          npm ci
          npm test -- --runInBand settings/opportunity-pipeline-flags.spec.ts settings/settings.dto.spec.ts
          npm run build
          npm run lint

      - name: Verify web flag client
        working-directory: edutu-web-app
        run: |
          npm ci
          npm test -- src/services/webConfig.test.ts src/hooks/useWebFeatureFlag.test.tsx
          npm run typecheck
          npm run lint
          npm run build

      - name: Verify admin rollout controls
        working-directory: admin
        env:
          VITE_BACKEND_URL: https://api.edutu.org
        run: |
          npm ci
          npm test -- src/lib/opportunityPipelineFlags.test.ts
          npm run lint
          npm run build

      - name: Verify documentation contract
        shell: bash
        run: |
          grep -q "Opening an external application link never marks" docs/product/opportunity-pipeline-contract.md
          grep -q "edutumobile" docs/product/opportunity-pipeline-contract.md
          grep -q "opportunity_pipeline_navigation" docs/runbooks/opportunity-pipeline-flags.md
          grep -q "Intentional opportunity pipeline boundary" docs/ARCHITECTURE.md

      - name: Commit verified implementation
        shell: bash
        run: |
          rm scripts/pr1_apply.py
          rm .github/workflows/pr1-implementation.yml
          rm .github/workflows/pr1-resume.yml
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(config): add opportunity pipeline rollout foundation"
          git push origin HEAD:feat/opportunity-pipeline-pr1
