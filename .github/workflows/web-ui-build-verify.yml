name: Web UI Build Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'edutu-web-app/**'
      - '.github/workflows/web-ui-build-verify.yml'

jobs:
  web-build:
    name: Web Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutu-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edutu-web-app/package-lock.json
      - run: npm ci
      - run: npm run build
