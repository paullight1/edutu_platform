name: CI Baseline Repair

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-baseline-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-ownership:
    name: Migration Ownership Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/migration-ownership.test.mjs
      - run: node scripts/check-migration-ownership.mjs

  backend-migrations:
    name: Canonical Community Migration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/services/services/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json
      - run: npm ci
      - run: >-
          npm test -- --runInBand
          communities/community-admin-management.migration.spec.ts
          communities/community-first-impression-seed.spec.ts

  admin-runtime:
    name: Admin Runtime Config Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test -- src/lib/runtimeConfig.spec.ts
      - run: npm test
      - run: npm run build
