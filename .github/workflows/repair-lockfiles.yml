name: Apply hardening formatting fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-hardening-fixes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/production-hardening-p0-p1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format inherited backend lint drift
        working-directory: backend/services/services/api
        run: |
          set -euo pipefail
          npm ci
          npm run lint:fix
      - name: Fix web hook dependency lint
        working-directory: edutu-web-app
        run: |
          set -euo pipefail
          npm ci
          npx eslint src/components/UpgradePage.tsx --fix
      - name: Commit formatting repairs
        run: |
          set -euo pipefail
          git add backend/services/services/api/src edutu-web-app/src/components/UpgradePage.tsx
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: repair inherited lint drift"
          git push origin HEAD:${{ github.head_ref }}
