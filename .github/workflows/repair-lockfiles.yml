name: Apply hardening fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-hardening-fixes:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/production-hardening-p0-p1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mobile audit policy tests
        run: node --test scripts/check-mobile-audit.test.mjs
      - name: Fix web hook dependency lint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('edutu-web-app/src/components/UpgradePage.tsx')
          text = path.read_text()
          old = "  }, [pricing, selectedTier]);"
          new = "  }, [checkoutEnabled, pricing, selectedTier]);"
          if old not in text and new not in text:
              raise SystemExit('Expected UpgradePage dependency list not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit targeted repair
        run: |
          set -euo pipefail
          git add edutu-web-app/src/components/UpgradePage.tsx
          if git diff --cached --quiet; then
            echo "Targeted repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(web): include checkout state in pricing memo"
          git push origin HEAD:${{ github.head_ref }}
