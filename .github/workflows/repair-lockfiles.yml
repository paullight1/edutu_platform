name: Hardening maintenance helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-policy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/check-mobile-audit.test.mjs
