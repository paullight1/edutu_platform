name: Minimize Opportunity Detail UX Diff

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply-opportunity-detail-ux.py"
      - ".github/workflows/opportunity-detail-ux-minimize.yml"

permissions:
  contents: write

concurrency:
  group: minimize-opportunity-detail-ux-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  minimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edutumobile/package-lock.json

      - name: Reconcile with latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Restore the unformatted baseline for the large screen
        run: git checkout origin/main -- 'edutumobile/app/(app)/opportunities/[id].tsx'

      - name: Apply only the reviewed UX edits
        run: python .github/scripts/apply-opportunity-detail-ux.py

      - name: Install locked mobile dependencies
        working-directory: edutumobile
        run: npm ci

      - name: Format focused helpers and tests only
        working-directory: edutumobile
        run: |
          npx prettier --write \
            lib/opportunityDisplay.ts \
            lib/__tests__/opportunityDisplay.test.ts \
            lib/__tests__/opportunityDetailHierarchy.test.ts \
            components/opportunity/CollapsibleSection.tsx \
            components/opportunity/RequirementChecklist.tsx \
            components/opportunity/__tests__/CollapsibleSection.test.tsx \
            components/opportunity/__tests__/RequirementChecklist.test.tsx

      - name: Run focused opportunity UX tests
        working-directory: edutumobile
        run: |
          npm run test -- --runInBand \
            lib/__tests__/opportunityDisplay.test.ts \
            lib/__tests__/opportunityDetailHierarchy.test.ts \
            components/opportunity/__tests__/CollapsibleSection.test.tsx \
            components/opportunity/__tests__/RequirementChecklist.test.tsx

      - name: Run mobile TypeScript and lint gates
        working-directory: edutumobile
        run: |
          npm run typecheck
          npm run lint

      - name: Ensure the large screen has a focused diff
        run: |
          CHANGED_LINES=$(git diff --numstat origin/main -- 'edutumobile/app/(app)/opportunities/[id].tsx' | awk '{print $1 + $2}')
          echo "Opportunity detail changed lines: ${CHANGED_LINES:-0}"
          test "${CHANGED_LINES:-0}" -lt 700

      - name: Remove temporary minimizer files
        run: |
          rm .github/scripts/apply-opportunity-detail-ux.py
          rm .github/workflows/opportunity-detail-ux-minimize.yml

      - name: Commit the focused implementation
        run: |
          git add \
            .github/scripts/apply-opportunity-detail-ux.py \
            .github/workflows/opportunity-detail-ux-minimize.yml \
            edutumobile/lib/opportunityDisplay.ts \
            edutumobile/lib/__tests__/opportunityDisplay.test.ts \
            edutumobile/lib/__tests__/opportunityDetailHierarchy.test.ts \
            edutumobile/components/opportunity/CollapsibleSection.tsx \
            edutumobile/components/opportunity/RequirementChecklist.tsx \
            edutumobile/components/opportunity/__tests__/CollapsibleSection.test.tsx \
            edutumobile/components/opportunity/__tests__/RequirementChecklist.test.tsx \
            'edutumobile/app/(app)/opportunities/[id].tsx'
          git commit -m "refactor(mobile): keep opportunity UX diff focused"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
