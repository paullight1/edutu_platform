name: SEO Pagination Fix Once

on:
  push:
    branches: [codex/seo-p0-p4]
    paths:
      - ".github/workflows/seo-pagination-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend/services/services/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/seo-p0-p4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json
      - run: npm ci
      - name: Return 404 for empty pages after page one
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/seo/seo.controller.ts")
          text = path.read_text()

          blog_old = '''    const hasNext = posts.length > BLOG_PAGE_SIZE;
              const visible = posts.slice(0, BLOG_PAGE_SIZE);
              const canonicalPath = page > 1 ? `/blog?page=${page}` : "/blog";
              const canonicalUrl = this.absolute(canonicalPath);
              const description ='''
          blog_new = '''    const hasNext = posts.length > BLOG_PAGE_SIZE;
              const visible = posts.slice(0, BLOG_PAGE_SIZE);
              const canonicalPath = page > 1 ? `/blog?page=${page}` : "/blog";
              const canonicalUrl = this.absolute(canonicalPath);
              if (page > 1 && visible.length === 0) {
                return this.respond(res, this.notFoundPage("Blog page", canonicalUrl), {
                  status: 404,
                  useShell: false,
                });
              }
              const description ='''

          opportunity_old = '''    const canonicalUrl = this.absolute(canonicalPath);
              const title = category
                ? category.title'''
          opportunity_new = '''    const canonicalUrl = this.absolute(canonicalPath);
              if (page > 1 && loaded.items.length === 0) {
                return this.respond(
                  res,
                  this.notFoundPage("Opportunity page", canonicalUrl),
                  { status: 404, useShell: false },
                );
              }
              const title = category
                ? category.title'''

          if text.count(blog_old) != 1:
              raise SystemExit("Blog archive insertion point was not unique")
          if text.count(opportunity_old) != 1:
              raise SystemExit("Opportunity archive insertion point was not unique")

          text = text.replace(blog_old, blog_new).replace(
              opportunity_old, opportunity_new
          )
          path.write_text(text)
          PY
      - name: Format and verify the focused contracts
        run: |
          npx eslint "src/seo/**/*.ts" --fix
          npm test -- --runInBand --testPathPatterns="src/seo"
      - name: Commit the tested fix
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/services/api/src/seo/seo.controller.ts
          git commit -m "fix(seo): reject empty paginated archives"
          git push origin HEAD:codex/seo-p0-p4
