    if (this.compatibilityService) {
      await this.compatibilityService.mirrorJourney(userId, result.journey);
    }
    if (this.journeyCache) {
      await this.journeyCache.invalidateUser(userId);
    }
    return result;
  }'''
              if ctor_marker not in text:
                  raise SystemExit('constructor marker missing')
              text = text.replace(ctor_marker, ctor_replacement, 1)

