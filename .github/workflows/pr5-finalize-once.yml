          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json
      - working-directory: backend/services/services/api
        run: npm ci
      - name: Ensure compatibility effects and cache invalidation
