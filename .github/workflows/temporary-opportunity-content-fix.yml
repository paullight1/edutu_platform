name: Temporary Opportunity Content Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temporary-opportunity-content-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-and-format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/opportunity-content-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json

      - name: Install the locked backend toolchain
        working-directory: backend/services/services/api
        run: npm ci

      - name: Apply the evidenced semantic fixes
        run: node scripts/ci-fix-opportunity-content.mjs

      - name: Format only the affected backend files
        working-directory: backend/services/services/api
        run: npx eslint "src/opportunities/opportunity-content*.ts" --fix

      - name: Format the moved mobile test with the same locked Prettier
        working-directory: backend/services/services/api
        run: >-
          npx prettier --write
          "$GITHUB_WORKSPACE/edutumobile/components/opportunity/__tests__/CollapsibleSection.test.tsx"

      - name: Verify the backend lint gate
        working-directory: backend/services/services/api
        run: npm run lint

      - name: Remove temporary CI scaffolding
        run: |
          rm .github/workflows/temporary-opportunity-content-fix.yml
          rm scripts/ci-fix-opportunity-content.mjs

      - name: Guard the generated diff
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -Ev '^(backend/services/services/api/src/opportunities/opportunity-content[^/]*\.ts|edutumobile/components/opportunity/(CollapsibleSection\.test\.tsx|__tests__/CollapsibleSection\.test\.tsx)|\.github/workflows/temporary-opportunity-content-fix\.yml|scripts/ci-fix-opportunity-content\.mjs)$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed by the temporary formatter:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git status --short

      - name: Commit the generated fixes to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "fix: satisfy opportunity content verification gates"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
