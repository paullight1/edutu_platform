name: Agent Source Snapshot

on:
  push:
    branches:
      - feat/web-community-parity-seo
    paths:
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='**/dist' \
            --exclude='**/.next' \
            --exclude='**/.expo' \
            -czf /tmp/edutu-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: edutu-community-source
          path: /tmp/edutu-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish temporary run id
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}/issues/56/comments" \
            --method POST \
            --field body="agent-source-snapshot-run:${GITHUB_RUN_ID}"
