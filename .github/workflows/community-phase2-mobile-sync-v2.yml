name: Community Phase 2 Mobile Sync v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/community-phase2-mobile-sync-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-community-parity-seo
          fetch-depth: 0

      - name: Replace DM polling with focused realtime
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("edutumobile/app/(app)/discussions/dm/[id].tsx")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one mobile DM match, found {count}: {old[:100]!r}"
                  )
              text = text.replace(old, new, 1)

          replace_once(
              "} from '@edutu/core/src/services/communityDms';\n",
              """} from '@edutu/core/src/services/communityDms';
          import {
            subscribeToDmMessages,
            type DmRealtimeMessage,
          } from '@edutu/core/src/services/communityDmsRealtime';
          """,
          )
          replace_once(
              "const REFRESH_INTERVAL_MS = 10_000;",
              "const RECONCILIATION_INTERVAL_MS = 60_000;",
          )

          helper_marker = "\n}\n\nexport default function DirectMessageScreen()"
          if text.count(helper_marker) != 1:
              raise SystemExit("Could not locate mergeDmMessages boundary")
          helper = """
          }

          function hydrateRealtimeDmMessage(
            event: DmRealtimeMessage,
            userId: string | null | undefined,
            conversation: DmConversationDetail | null,
          ): DmMessage {
            const sender = event.senderId === userId
              ? { userId: event.senderId, displayName: 'You', avatarUrl: null }
              : conversation?.otherUser.userId === event.senderId
                ? conversation.otherUser
                : {
                    userId: event.senderId,
                    displayName: 'Edutu member',
                    avatarUrl: null,
                  };
            return { ...event, sender };
          }

          export default function DirectMessageScreen()"""
          text = text.replace(helper_marker, "\n" + helper.strip("\n"), 1)

          replace_once(
              "  const managingLock = useRef(false);\n",
              """  const managingLock = useRef(false);
            const conversationRef = useRef<DmConversationDetail | null>(null);
          """,
          )

          effect_pattern = re.compile(
              r"(  useEffect\(\(\) => \{\n"
              r"    activeConversationIdRef\.current = conversationId;\n"
              r"  \}, \[conversationId\]\);\n)"
          )
          text, effect_count = effect_pattern.subn(
              r"\1\n  useEffect(() => {\n"
              r"    conversationRef.current = conversation;\n"
              r"  }, [conversation]);\n",
              text,
              count=1,
          )
          if effect_count != 1:
              raise SystemExit(f"Could not extend conversation ref effect; matches={effect_count}")

          replace_once(
              "setMessages((current) => routeChanged ? page : mergeDmMessages(current, page));",
              "setMessages((current) => mergeDmMessages(current, page));",
          )

          focus_pattern = re.compile(
              r"  useFocusEffect\(\n.*?\n  \);\n\n  const loadOlder",
              re.DOTALL,
          )
          focus_replacement = """  useFocusEffect(
            useCallback(() => {
              let active = true;
              screenActiveRef.current = true;
              let reconciliationTimer: ReturnType<typeof setTimeout> | undefined;

              if (!conversationId) {
                void load();
                return () => {
                  active = false;
                  screenActiveRef.current = false;
                  loadRequestVersion.current += 1;
                };
              }

              const unsubscribe = subscribeToDmMessages(
                conversationId,
                (event) => {
                  if (
                    !active ||
                    !screenActiveRef.current ||
                    event.conversationId !== activeConversationIdRef.current
                  ) return;

                  const hydrated = hydrateRealtimeDmMessage(
                    event,
                    userId,
                    conversationRef.current,
                  );
                  setMessages((current) => mergeDmMessages(current, [hydrated]));
                  setConversation((current) =>
                    current ? { ...current, lastMessageAt: event.createdAt } : current,
                  );

                  if (
                    event.senderId !== userId &&
                    event.id !== lastMarkedMessageId.current
                  ) {
                    lastMarkedMessageId.current = event.id;
                    void markDmConversationRead(conversationId, getToken).catch(() => {
                      if (lastMarkedMessageId.current === event.id) {
                        lastMarkedMessageId.current = null;
                      }
                    });
                  }
                },
              );

              const reconcile = async () => {
                await load();
                if (active) {
                  reconciliationTimer = setTimeout(
                    () => void reconcile(),
                    RECONCILIATION_INTERVAL_MS,
                  );
                }
              };
              void reconcile();

              return () => {
                active = false;
                screenActiveRef.current = false;
                if (reconciliationTimer) clearTimeout(reconciliationTimer);
                unsubscribe();
                loadRequestVersion.current += 1;
              };
            }, [conversationId, getToken, load, userId]),
          );

            const loadOlder"""
          text, focus_count = focus_pattern.subn(
              focus_replacement,
              text,
              count=1,
          )
          if focus_count != 1:
              raise SystemExit(f"Could not replace focused DM lifecycle; matches={focus_count}")

          path.write_text(text)
          for workflow in (
              ".github/workflows/community-phase2-mobile-sync.yml",
              ".github/workflows/community-phase2-mobile-sync-v2.yml",
          ):
              Path(workflow).unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(community): synchronize mobile DMs in realtime"
          git push origin HEAD:feat/web-community-parity-seo
