name: Local Review Gate

on:
  pull_request:
    branches: [main, develop]
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Local Review Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test release-review policy
        run: node --test scripts/release-review.test.mjs
      - name: Validate exact-commit review evidence
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-release-review.mjs
      - name: Explain manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "Policy tests passed. Pull-request evidence is validated only on pull_request events."
