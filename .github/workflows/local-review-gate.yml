name: Local Review Gate

on:
  pull_request_target:
    branches: [main, develop]
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: local-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Local Review Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test trusted release-review policy
        run: >-
          node --test
          scripts/release-review.test.mjs
          scripts/local-review-workflow-security.test.mjs
      - name: Validate exact-commit review evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-release-review.mjs
