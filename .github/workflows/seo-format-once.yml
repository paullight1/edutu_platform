name: SEO Format Once

on:
  push:
    branches: [codex/seo-p0-p4]
    paths:
      - ".github/workflows/seo-format-once.yml"
      - "backend/services/services/api/src/seo/**"

permissions:
  contents: write

concurrency:
  group: seo-format-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/services/services/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/seo-p0-p4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json
      - run: npm ci
      - name: Apply the repository ESLint and Prettier rules
        run: npx eslint "src/seo/**/*.ts" --fix
      - name: Commit formatter output
        working-directory: .
        run: |
          if git diff --quiet -- backend/services/services/api/src/seo; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/services/api/src/seo
          git commit -m "style(seo): apply repository formatter"
          git push origin HEAD:codex/seo-p0-p4
