name: Finalize Opportunity Detail UX

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply-opportunity-detail-ux.py"
      - ".github/workflows/opportunity-detail-ux-finalize.yml"
      - "edutumobile/**"

permissions:
  contents: write

concurrency:
  group: finalize-opportunity-detail-ux-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edutumobile/package-lock.json

      - name: Reconcile with latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Install locked mobile dependencies
        working-directory: edutumobile
        run: npm ci

      - name: Apply reviewed opportunity detail patch
        run: python .github/scripts/apply-opportunity-detail-ux.py

      - name: Format affected files
        working-directory: edutumobile
        run: |
          npx prettier --write \
            lib/opportunityDisplay.ts \
            lib/__tests__/opportunityDisplay.test.ts \
            lib/__tests__/opportunityDetailHierarchy.test.ts \
            components/opportunity/CollapsibleSection.tsx \
            components/opportunity/RequirementChecklist.tsx \
            components/opportunity/__tests__/CollapsibleSection.test.tsx \
            components/opportunity/__tests__/RequirementChecklist.test.tsx \
            'app/(app)/opportunities/[id].tsx'

      - name: Run focused opportunity UX tests
        working-directory: edutumobile
        run: |
          npm run test -- --runInBand \
            lib/__tests__/opportunityDisplay.test.ts \
            lib/__tests__/opportunityDetailHierarchy.test.ts \
            components/opportunity/__tests__/CollapsibleSection.test.tsx \
            components/opportunity/__tests__/RequirementChecklist.test.tsx

      - name: Run mobile TypeScript and lint gates
        working-directory: edutumobile
        run: |
          npm run typecheck
          npm run lint

      - name: Remove temporary finalizer files
        run: |
          rm .github/scripts/apply-opportunity-detail-ux.py
          rm .github/workflows/opportunity-detail-ux-finalize.yml

      - name: Guard and commit the implementation
        run: |
          git add \
            .github/scripts/apply-opportunity-detail-ux.py \
            .github/workflows/opportunity-detail-ux-finalize.yml \
            edutumobile/lib/opportunityDisplay.ts \
            edutumobile/lib/__tests__/opportunityDisplay.test.ts \
            edutumobile/lib/__tests__/opportunityDetailHierarchy.test.ts \
            edutumobile/components/opportunity/CollapsibleSection.tsx \
            edutumobile/components/opportunity/RequirementChecklist.tsx \
            edutumobile/components/opportunity/__tests__/CollapsibleSection.test.tsx \
            edutumobile/components/opportunity/__tests__/RequirementChecklist.test.tsx \
            'edutumobile/app/(app)/opportunities/[id].tsx'

          python - <<'PY'
          import subprocess

          allowed = {
              ".github/scripts/apply-opportunity-detail-ux.py",
              ".github/workflows/opportunity-detail-ux-finalize.yml",
              "edutumobile/lib/opportunityDisplay.ts",
              "edutumobile/lib/__tests__/opportunityDisplay.test.ts",
              "edutumobile/lib/__tests__/opportunityDetailHierarchy.test.ts",
              "edutumobile/components/opportunity/CollapsibleSection.tsx",
              "edutumobile/components/opportunity/RequirementChecklist.tsx",
              "edutumobile/components/opportunity/__tests__/CollapsibleSection.test.tsx",
              "edutumobile/components/opportunity/__tests__/RequirementChecklist.test.tsx",
              "edutumobile/app/(app)/opportunities/[id].tsx",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(
                  f"Unexpected files in final commit: {sorted(unexpected)}"
              )
          if not changed:
              raise SystemExit("Finalizer produced no staged changes")
          PY

          git commit -m "feat(mobile): clarify opportunity detail hierarchy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
