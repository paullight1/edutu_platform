name: PR 3 Surgical Fix Once

on:
  push:
    branches:
      - feat/opportunity-pipeline-pr3
    paths:
      - ".github/workflows/pr3-surgical-fix-once.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'paullight1/edutu_platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opportunity-pipeline-pr3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json
      - working-directory: backend/services/services/api
        run: npm ci
      - name: Apply reviewed source integrations
        run: |
          python - <<'PY'
          from pathlib import Path

          repository_path = Path("backend/services/services/api/src/opportunity-journeys/opportunity-journeys.repository.ts")
          repository = repository_path.read_text()
          old_alias = "export interface ReplaceActiveIntentEvent extends OpportunityJourneyEventInput {}"
          new_alias = "export type ReplaceActiveIntentEvent = OpportunityJourneyEventInput;"
          if old_alias not in repository:
              raise SystemExit("repository event alias marker not found")
          repository_path.write_text(repository.replace(old_alias, new_alias))

          ranking_path = Path("backend/services/services/api/src/opportunities/opportunity-ranking.service.ts")
          ranking = ranking_path.read_text()
          import_marker = 'import { checkEligibility } from "./eligibility.util";'
          import_replacement = import_marker + '\nimport { toEligibilityProfile } from "./eligibility-profile.util";'
          if import_marker not in ranking or 'from "./eligibility-profile.util"' in ranking:
              raise SystemExit("ranking import marker missing or already replaced")
          ranking = ranking.replace(import_marker, import_replacement, 1)
          if "this.toEligibilityProfile(profile)" not in ranking:
              raise SystemExit("ranking eligibility call marker not found")
          ranking = ranking.replace("this.toEligibilityProfile(profile)", "toEligibilityProfile(profile)")
          start = ranking.find("  /**\n   * Maps either profile shape the pipeline sees")
          end = ranking.find("  private async getUserProfile", start)
          if start < 0 or end < 0:
              raise SystemExit("ranking private mapper block not found")
          ranking = ranking[:start] + ranking[end:]
          ranking_path.write_text(ranking)
          PY
      - name: Format touched files
        working-directory: backend/services/services/api
        run: >-
          npx prettier --write
          src/opportunity-journeys/opportunity-journeys.repository.ts
          src/opportunities/opportunity-ranking.service.ts
      - name: Commit reviewed integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/services/api/src/opportunity-journeys/opportunity-journeys.repository.ts \
            backend/services/services/api/src/opportunities/opportunity-ranking.service.ts
          git diff --cached --quiet || git commit -m "refactor(api): share eligibility profile mapping"
          git push origin HEAD:feat/opportunity-pipeline-pr3
