name: Dependency Lockfile Repair

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: dependency-lockfile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply Verified Lockfile Repairs
    if: >-
      github.actor == 'paullight1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ci-baseline-83'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json

      - name: Patch backend lockfile without changing package manifest ranges
        working-directory: backend/services/services/api
        run: |
          npm audit fix --package-lock-only --audit-level=high
          npm audit --audit-level=high

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            edutu-web-app/package-lock.json
            edutumobile/package-lock.json

      - name: Patch web lockfile without changing package manifest ranges
        working-directory: edutu-web-app
        run: |
          npm audit fix --package-lock-only --audit-level=high
          npm audit --audit-level=high

      - name: Patch mobile lockfile without changing package manifest ranges
        working-directory: edutumobile
        run: npm audit fix --package-lock-only --audit-level=high

      - name: Verify mobile policy and explicit security floors
        run: |
          node scripts/check-mobile-audit.mjs
          node --test scripts/security-lockfile-versions.test.mjs

      - name: Commit only the three verified lockfiles
        shell: bash
        run: |
          git diff --check -- \
            backend/services/services/api/package-lock.json \
            edutu-web-app/package-lock.json \
            edutumobile/package-lock.json

          git add \
            backend/services/services/api/package-lock.json \
            edutu-web-app/package-lock.json \
            edutumobile/package-lock.json

          if git diff --cached --quiet; then
            echo "Lockfiles already satisfy the high-severity audit policy."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): patch high-severity transitive dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
