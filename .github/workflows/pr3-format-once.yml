name: PR 3 Format Once

on:
  push:
    branches:
      - feat/opportunity-pipeline-pr3
    paths:
      - ".github/workflows/pr3-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'paullight1/edutu_platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opportunity-pipeline-pr3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json
      - working-directory: backend/services/services/api
        run: npm ci
      - name: Format only PR 3 source and tests
        working-directory: backend/services/services/api
        run: >-
          npx prettier --write
          src/opportunities/eligibility-profile.util.ts
          src/opportunities/eligibility-profile.util.spec.ts
          src/opportunity-journeys/dto/opportunity-intent.dto.ts
          src/opportunity-journeys/opportunity-decision-support.ts
          src/opportunity-journeys/opportunity-decision-support.spec.ts
          src/opportunity-journeys/opportunity-effort.ts
          src/opportunity-journeys/opportunity-effort.spec.ts
          src/opportunity-journeys/opportunity-intent.service.ts
          src/opportunity-journeys/opportunity-intent.service.spec.ts
          src/opportunity-journeys/opportunity-journey-event.ts
          src/opportunity-journeys/opportunity-journey-templates.ts
          src/opportunity-journeys/opportunity-journey-templates.spec.ts
          src/opportunity-journeys/opportunity-journeys.repository.ts
          src/opportunity-journeys/opportunity-journeys.repository.spec.ts
          src/opportunity-journeys/opportunity-next-action.ts
          src/opportunity-journeys/opportunity-next-action.spec.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/services/api/src/opportunities/eligibility-profile.util.ts \
            backend/services/services/api/src/opportunities/eligibility-profile.util.spec.ts \
            backend/services/services/api/src/opportunity-journeys
          git diff --cached --quiet || git commit -m "style(api): format opportunity pipeline domain"
          git push origin HEAD:feat/opportunity-pipeline-pr3
