name: CI

# Backend stays on Node 20 to match the current production runtime.
# Frontend/mobile/voice jobs use Node 22 because current Capacitor, Metro and
# mediasoup dependencies require it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr51-autofix:
    name: PR 51 Scoped Corrective Patch
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 51 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-p0-p1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/pr51-autofix.mjs
      - name: Commit corrective patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'edutumobile/app/(app)/paywall.tsx' \
            'edutumobile/app/(app)/profile/edit.tsx' \
            'backend/services/services/api/src/profile/profile-creation.contract.spec.ts'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Corrective patch already applied."
            exit 0
          fi
          git commit -m "fix(ci): align profile and paywall hardening contracts"
          git push origin HEAD:fix/production-hardening-p0-p1

  repository-governance:
    name: Repository Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/check-mobile-audit.test.mjs
      - run: node scripts/check-migration-timestamps.mjs
      - run: node scripts/check-large-file-budgets.mjs

  edge-function-security:
    name: Edge Function Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read backend/services/services/api/supabase/functions/n8n-webhook/auth.test.ts

  voice-gateway:
    name: Voice Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/services/services/voice
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/services/services/voice/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:smoke

  backend-test:
    name: Backend Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/services/services/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/services/services/api/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/services/services/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/services/services/api/package-lock.json
      - run: npm ci
      - run: npm run lint

  mobile-typecheck:
    name: Mobile TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutumobile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edutumobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  mobile-test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: edutumobile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edutumobile/package-lock.json
      - run: npm ci
      - run: npm run test -- --passWithNoTests

  mobile-lint:
    name: Mobile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutumobile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edutumobile/package-lock.json
      - run: npm ci
      - run: npm run lint

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  admin-lint:
    name: Admin Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm test

  web-build:
    name: Web TypeCheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: edutu-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edutu-web-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  web-lint:
    name: Web Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutu-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edutu-web-app/package-lock.json
      - run: npm ci
      - run: npm run lint

  web-test:
    name: Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutu-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edutu-web-app/package-lock.json
      - run: npm ci
      - run: npm run test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend high/critical audit
        run: cd backend/services/services/api && npm ci && npm audit --audit-level=high
      - name: Admin high/critical audit
        run: cd admin && npm ci && npm audit --audit-level=high
      - name: Web high/critical audit
        run: cd edutu-web-app && npm ci && npm audit --audit-level=high
      - name: Mobile install
        run: cd edutumobile && npm ci
      - name: Mobile high/critical policy audit
        run: node scripts/check-mobile-audit.mjs

  security-audit-voice:
    name: Security Audit — Voice Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/services/services/voice
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/services/services/voice/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
