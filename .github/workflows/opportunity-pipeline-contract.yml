name: Opportunity Pipeline Contract

on:
  pull_request:
    paths:
      - ".github/workflows/opportunity-pipeline-contract.yml"
      - "backend/services/services/api/drizzle.config.ts"
      - "backend/services/services/api/src/db/all-schema.ts"
      - "backend/services/services/api/src/db/index.ts"
      - "backend/services/services/api/src/db/opportunity-journey.schema.ts"
      - "backend/services/services/api/src/db/schema.ts"
      - "backend/services/services/api/src/opportunities/eligibility-profile.util.ts"
      - "backend/services/services/api/src/opportunities/eligibility-profile.util.spec.ts"
      - "backend/services/services/api/src/opportunities/eligibility.util.spec.ts"
      - "backend/services/services/api/src/opportunities/opportunity-ranking.service.ts"
      - "backend/services/services/api/src/opportunity-journeys/**"
      - "backend/services/services/api/test/task-opportunity-pipeline/**"
      - "backend/services/services/api/supabase/migrations/*opportunity_journey*.sql"
      - "docs/operations/opportunity-pipeline-pr3-domain.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-pipeline-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    name: Opportunity Pipeline Backend Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/services/services/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false
      - name: Record the exact reviewed source SHA
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json
      - run: npm ci
      - name: Run focused opportunity pipeline tests
        run: >-
          npm test -- --runInBand
          opportunity-journey-state.spec.ts
          opportunity-journey-schema.contract.spec.ts
          opportunity-journeys.repository.spec.ts
          eligibility-profile.util.spec.ts
          eligibility.util.spec.ts
          opportunity-decision-support.spec.ts
          opportunity-intent.service.spec.ts
          opportunity-journey-templates.spec.ts
          opportunity-effort.spec.ts
          opportunity-next-action.spec.ts
      - run: npm run lint
      - run: npm run build
      - name: Validate canonical migration timestamps
        working-directory: .
        run: node scripts/check-migration-timestamps.mjs
