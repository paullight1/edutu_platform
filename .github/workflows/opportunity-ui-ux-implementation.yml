name: Implement Opportunity Detail UX

on:
  push:
    branches: [agent/opportunity-content-ux]
    paths:
      - ".github/workflows/opportunity-ui-ux-implementation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunity-detail-ux-implementation
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-content-ux
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edutumobile/package-lock.json

      - name: Reconcile with latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Install locked mobile dependencies
        working-directory: edutumobile
        run: npm ci

      - name: Implement the approved hierarchy and interaction design
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # Display helper: avoid repeating an AI summary that merely restates
          # the opening description.
          # -----------------------------------------------------------------
          path = Path("edutumobile/lib/opportunityDisplay.ts")
          text = path.read_text()
          summary_helper = r'''
          function normaliseForComparison(value?: string | null): string {
            return cleanOpportunityNarrative(value)
              .replace(/\s+/g, " ")
              .toLocaleLowerCase()
              .replace(/[^\p{L}\p{N}\s]/gu, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          /**
           * Keep the compact summary only when it adds decision context. A
           * summary that is identical to, starts, or substantially overlaps the
           * description creates duplicate reading rather than useful hierarchy.
           */
          export function shouldShowOpportunitySummary(
            summary?: string | null,
            description?: string | null,
          ): boolean {
            const cleanSummary = normaliseForComparison(summary);
            if (!cleanSummary) return false;

            const cleanDescription = normaliseForComparison(description);
            if (!cleanDescription) return true;
            if (
              cleanSummary === cleanDescription ||
              cleanDescription.startsWith(cleanSummary) ||
              cleanSummary.startsWith(cleanDescription)
            ) {
              return false;
            }

            const summaryTokens = new Set(
              cleanSummary.split(" ").filter((token) => token.length > 2),
            );
            const descriptionTokens = new Set(
              cleanDescription.split(" ").filter((token) => token.length > 2),
            );
            if (summaryTokens.size === 0) return false;

            let sharedTokens = 0;
            for (const token of summaryTokens) {
              if (descriptionTokens.has(token)) sharedTokens += 1;
            }

            return sharedTokens / summaryTokens.size < 0.78;
          }
          '''.strip("\n")
          text = replace_once(
              text,
              "\nexport function previewText(value: string, maxChars = 140): string {",
              f"\n{summary_helper}\n\nexport function previewText(value: string, maxChars = 140): string {{",
              "insert summary distinctness helper",
          )
          path.write_text(text)

          # -----------------------------------------------------------------
          # Long-form section: add a continuation fade and make the reveal
          # control look intentional rather than like another inline link.
          # -----------------------------------------------------------------
          path = Path("edutumobile/components/opportunity/CollapsibleSection.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              'import Animated, { FadeIn } from "react-native-reanimated";\n',
              'import Animated, { FadeIn } from "react-native-reanimated";\nimport { LinearGradient } from "expo-linear-gradient";\n',
              "add gradient import",
          )
          text = replace_once(
              text,
              '''            {displayChildren}
          </View>

          {useProgressiveDisclosure ? (''',
              '''            {displayChildren}
            {contentIsClipped ? (
              <LinearGradient
                testID="collapsible-content-fade"
                pointerEvents="none"
                colors={["transparent", colors.background]}
                style={styles.contentFade}
              />
            ) : null}
          </View>

          {useProgressiveDisclosure ? (''',
              "add clipped-content fade",
          )
          text = replace_once(
              text,
              '              style={styles.viewMoreButton}\n',
              '''              style={[
                styles.viewMoreButton,
                {
                  backgroundColor: `${colors.accent}0D`,
                  borderColor: `${colors.accent}24`,
                },
              ]}
''',
              "strengthen reveal control",
          )
          text = replace_once(
              text,
              '  contentClip: { gap: 10 },\n',
              '''  contentClip: { gap: 10, position: "relative" },
  contentFade: {
    position: "absolute",
    left: 0,
    right: 0,
    bottom: 0,
    height: 78,
  },
''',
              "add fade styles",
          )
          text = replace_once(
              text,
              '''  viewMoreButton: {
    alignSelf: "flex-start",
    minHeight: 36,
    justifyContent: "center",
  },
  viewMoreInner: {
    flexDirection: "row",
    alignItems: "center",
    gap: 4,
  },''',
              '''  viewMoreButton: {
    alignSelf: "stretch",
    minHeight: 42,
    justifyContent: "center",
    borderWidth: 1,
    borderRadius: 12,
    borderCurve: "continuous",
    paddingHorizontal: 12,
  },
  viewMoreInner: {
    flexDirection: "row",
    alignItems: "center",
    justifyContent: "center",
    gap: 5,
  },''',
              "improve reveal button geometry",
          )
          path.write_text(text)

          # -----------------------------------------------------------------
          # Requirement checklist: communicate progress while preserving the
          # wording as a factual requirement, not a completed to-do item.
          # -----------------------------------------------------------------
          path = Path("edutumobile/components/opportunity/RequirementChecklist.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              '''type RequirementChecklistProps = {
  opportunityId: string;
  items: string[];
};''',
              '''type RequirementChecklistProps = {
  opportunityId: string;
  items: string[];
  progressLabel?: (checked: number, total: number) => string;
};''',
              "add progress label contract",
          )
          text = replace_once(
              text,
              '''export function RequirementChecklist({
  opportunityId,
  items,
}: RequirementChecklistProps) {''',
              '''export function RequirementChecklist({
  opportunityId,
  items,
  progressLabel,
}: RequirementChecklistProps) {''',
              "accept progress label",
          )
          text = replace_once(
              text,
              '''  const displayItems = useMemo(
    () => cleanOpportunityListForDisplay(items),
    [items],
  );
''',
              '''  const displayItems = useMemo(
    () => cleanOpportunityListForDisplay(items),
    [items],
  );
  const checkedCount = useMemo(
    () => displayItems.filter((item) => checked.includes(item)).length,
    [checked, displayItems],
  );
  const progress =
    displayItems.length > 0 ? checkedCount / displayItems.length : 0;
''',
              "derive checklist progress",
          )
          text = replace_once(
              text,
              '''  return (
    <View style={styles.list}>
      {displayItems.map((item, index) => {''',
              '''  return (
    <View style={styles.list}>
      {displayItems.length > 0 ? (
        <View style={styles.progressWrap}>
          <Text style={[styles.progressText, { color: textSecondary }]}>
            {progressLabel
              ? progressLabel(checkedCount, displayItems.length)
              : `${checkedCount} of ${displayItems.length} checked`}
          </Text>
          <View
            style={[
              styles.progressTrack,
              {
                backgroundColor: isDark
                  ? "rgba(255,255,255,0.10)"
                  : "rgba(15,23,42,0.09)",
              },
            ]}
          >
            <View
              style={[
                styles.progressFill,
                {
                  backgroundColor: colors.accent,
                  width: `${Math.round(progress * 100)}%`,
                },
              ]}
            />
          </View>
        </View>
      ) : null}
      {displayItems.map((item, index) => {''',
              "render checklist progress",
          )
          text = replace_once(
              text,
              '''                  {
                    color: isChecked ? textSecondary : colors.foreground,
                    textDecorationLine: isChecked ? 'line-through' : 'none',
                  },''',
              '''                  {
                    color: isChecked ? textSecondary : colors.foreground,
                    fontWeight: isChecked ? '600' : '400',
                    opacity: isChecked ? 0.82 : 1,
                  },''',
              "preserve factual requirement text",
          )
          text = replace_once(
              text,
              "const styles = StyleSheet.create({\n  list: { gap: 4 },\n",
              '''const styles = StyleSheet.create({
  list: { gap: 4 },
  progressWrap: { gap: 7, marginBottom: 7 },
  progressText: { fontSize: 12, fontWeight: '700' },
  progressTrack: {
    height: 4,
    borderRadius: 999,
    overflow: 'hidden',
  },
  progressFill: { height: '100%', borderRadius: 999 },
''',
              "add checklist progress styles",
          )
          path.write_text(text)

          # -----------------------------------------------------------------
          # Opportunity detail: move source-backed information before optional
          # AI tooling and consolidate those tools into one support section.
          # -----------------------------------------------------------------
          path = Path("edutumobile/app/(app)/opportunities/[id].tsx")
          text = path.read_text()
          text = replace_once(
              text,
              '''  getMatchTier,
  previewText,
} from "../../../lib/opportunityDisplay";''',
              '''  getMatchTier,
  previewText,
  shouldShowOpportunitySummary,
} from "../../../lib/opportunityDisplay";''',
              "import summary helper",
          )
          text = replace_once(
              text,
              '''  const matchRisks = (opportunity.matchRisks || [])
    .map((item) => decodeMaybe(item).trim())
    .filter(Boolean);
''',
              '''  const matchRisks = (opportunity.matchRisks || [])
    .map((item) => decodeMaybe(item).trim())
    .filter(Boolean);
  const showAiSummary = shouldShowOpportunitySummary(aiSummary, description);
  const displayTags = Array.from(
    new Set(
      (opportunity.aiTags || [])
        .map((tag) => decodeMaybe(tag).trim())
        .filter(Boolean),
    ),
  ).slice(0, 5);
''',
              "derive summary and tag presentation",
          )

          fit_start = text.index("          {/* ── FIT")
          facts_start = text.index("          {/* ── FACTS", fit_start)
          fit_block = text[fit_start:facts_start]
          text = text[:fit_start] + text[facts_start:]

          tag_start = text.index("          {opportunity.aiTags")
          reference_start = text.index("          {/* ── REFERENCE", tag_start)
          tag_block = text[tag_start:reference_start]
          text = text[:tag_start] + text[reference_start:]

          plan_start = text.index("          {/* ── PLAN")
          publisher_start = text.index(
              "          {/* Publisher-supplied preparation steps", plan_start
          )
          plan_block = text[plan_start:publisher_start]
          text = text[:plan_start] + text[publisher_start:]

          fit_block = fit_block.replace(
              '<View style={{ marginTop: 22 }}>', '<View>', 1
          )
          tag_block = tag_block.replace(
              "opportunity.aiTags && opportunity.aiTags.length > 0",
              "displayTags.length > 0",
              1,
          ).replace("opportunity.aiTags.map", "displayTags.map", 1)

          text = replace_once(
              text,
              '''              title={t("detail.aboutTitle")}
              defaultExpanded
              preview={previewText(aiSummary || description)}''',
              '''              title={t("detail.aboutTitle")}
              defaultExpanded
              progressiveDisclosure
              collapsedBodyHeight={260}
              viewMoreLabel={t("detail.viewFullDetails", {
                defaultValue: "View full details",
              })}
              showLessLabel={t("detail.showLess", {
                defaultValue: "Show less",
              })}
              preview={previewText(showAiSummary ? aiSummary : description)}''',
              "upgrade About disclosure",
          )
          text = replace_once(
              text,
              "              {aiSummary && aiSummary !== description ? (",
              "              {showAiSummary ? (",
              "suppress repeated summary",
          )
          text = replace_once(
              text,
              '''                <RequirementChecklist opportunityId={opportunity.id} items={requirements} />''',
              '''                <RequirementChecklist
                  opportunityId={opportunity.id}
                  items={requirements}
                  progressLabel={(checked, total) =>
                    t("detail.requirementsProgress", {
                      checked,
                      total,
                      defaultValue: "{{checked}} of {{total}} checked",
                    })
                  }
                />''',
              "add requirement progress copy",
          )

          support_block = f'''          {{/* ── APPLICATION SUPPORT ──────────────────────────────────────────
              Optional tools are grouped after the learner has read the source
              facts, requirements, benefits and application steps. */}}
          <View style={{{{ marginTop: 8 }}}}>
            <CollapsibleSection
              title={{t("detail.applicationSupportTitle", {{
                defaultValue: "Help me apply",
              }})}}
              preview={{t("detail.applicationSupportPreview", {{
                defaultValue:
                  "Check your fit, review your CV, get the next move, or build a step-by-step plan.",
              }})}}
            >
              <View style={{styles.applicationSupportBody}}>
{fit_block}{plan_block}              </View>
            </CollapsibleSection>
          </View>

'''
          publisher_start = text.index(
              "          {/* Publisher-supplied preparation steps"
          )
          text = (
              text[:publisher_start]
              + tag_block
              + support_block
              + text[publisher_start:]
          )

          text = replace_once(
              text,
              '  summaryText: { fontSize: 14, lineHeight: 21 },\n',
              '  summaryText: { fontSize: 15, lineHeight: 22 },\n',
              "increase summary readability",
          )
          text = replace_once(
              text,
              '  description: { fontSize: 13, lineHeight: 21, marginBottom: 22 },\n',
              '  description: { fontSize: 15, lineHeight: 24, marginBottom: 8 },\n',
              "increase body readability",
          )
          text = replace_once(
              text,
              '  tagRow: { flexDirection: "row", flexWrap: "wrap", gap: 6, marginTop: 14 },\n',
              '''  tagRow: {
    flexDirection: "row",
    flexWrap: "wrap",
    gap: 6,
    marginTop: 14,
    marginBottom: 4,
  },
''',
              "refine tag spacing",
          )
          text = replace_once(
              text,
              '  askMoreChipText: { fontSize: 13, fontWeight: "700" },\n',
              '''  askMoreChipText: { fontSize: 13, fontWeight: "700" },
  applicationSupportBody: { gap: 4 },
''',
              "add support section rhythm",
          )
          path.write_text(text)
          PY

      - name: Format affected files
        working-directory: edutumobile
        run: |
          npx prettier --write \
            lib/opportunityDisplay.ts \
            lib/__tests__/opportunityDisplay.test.ts \
            lib/__tests__/opportunityDetailHierarchy.test.ts \
            components/opportunity/CollapsibleSection.tsx \
            components/opportunity/RequirementChecklist.tsx \
            components/opportunity/__tests__/CollapsibleSection.test.tsx \
            components/opportunity/__tests__/RequirementChecklist.test.tsx \
            'app/(app)/opportunities/[id].tsx'

      - name: Run focused opportunity UX tests
        working-directory: edutumobile
        run: |
          npm run test -- --runInBand \
            lib/__tests__/opportunityDisplay.test.ts \
            lib/__tests__/opportunityDetailHierarchy.test.ts \
            components/opportunity/__tests__/CollapsibleSection.test.tsx \
            components/opportunity/__tests__/RequirementChecklist.test.tsx

      - name: Run mobile TypeScript and lint gates
        working-directory: edutumobile
        run: |
          npm run typecheck
          npm run lint

      - name: Remove temporary implementation workflow
        run: rm .github/workflows/opportunity-ui-ux-implementation.yml

      - name: Guard and commit the implementation
        run: |
          git add \
            .github/workflows/opportunity-ui-ux-implementation.yml \
            edutumobile/lib/opportunityDisplay.ts \
            edutumobile/lib/__tests__/opportunityDisplay.test.ts \
            edutumobile/lib/__tests__/opportunityDetailHierarchy.test.ts \
            edutumobile/components/opportunity/CollapsibleSection.tsx \
            edutumobile/components/opportunity/RequirementChecklist.tsx \
            edutumobile/components/opportunity/__tests__/CollapsibleSection.test.tsx \
            edutumobile/components/opportunity/__tests__/RequirementChecklist.test.tsx \
            'edutumobile/app/(app)/opportunities/[id].tsx'

          python - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/opportunity-ui-ux-implementation.yml",
              "edutumobile/lib/opportunityDisplay.ts",
              "edutumobile/lib/__tests__/opportunityDisplay.test.ts",
              "edutumobile/lib/__tests__/opportunityDetailHierarchy.test.ts",
              "edutumobile/components/opportunity/CollapsibleSection.tsx",
              "edutumobile/components/opportunity/RequirementChecklist.tsx",
              "edutumobile/components/opportunity/__tests__/CollapsibleSection.test.tsx",
              "edutumobile/components/opportunity/__tests__/RequirementChecklist.test.tsx",
              "edutumobile/app/(app)/opportunities/[id].tsx",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"Unexpected files in implementation commit: {sorted(unexpected)}")
          if not changed:
              raise SystemExit("Implementation produced no staged changes")
          PY

          git commit -m "feat(mobile): clarify opportunity detail hierarchy"
          git push origin HEAD:agent/opportunity-content-ux
