name: Scraper Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "crawl4ai-scraper/**"
      - ".github/workflows/scraper-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "crawl4ai-scraper/**"
      - ".github/workflows/scraper-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scraper-tests:
    name: Scraper Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crawl4ai-scraper
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused unit-test dependencies
        run: python -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Run scraper unit tests
        run: python -m pytest -q tests
