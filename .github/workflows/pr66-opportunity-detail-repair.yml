name: PR 66 Opportunity Detail Repair

on:
  push:
    branches:
      - agent/opportunity-content-ux
    paths:
      - ".github/workflows/pr66-opportunity-detail-repair.yml"
      - "scripts/pr66-opportunity-detail-repair.py"

permissions:
  contents: write

concurrency:
  group: pr66-opportunity-detail-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Verify and commit repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-content-ux
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edutumobile/package-lock.json

      - name: Validate and apply repair
        run: |
          python -m py_compile scripts/pr66-opportunity-detail-repair.py
          python scripts/pr66-opportunity-detail-repair.py
          sed -i "s/pressNearestTouchTarget(getByText('Help me apply'));/fireEvent.press(getByText('Help me apply'));/" edutumobile/__tests__/mobileOpportunityDetail.test.tsx
          grep -F "fireEvent.press(getByText('Help me apply'));" edutumobile/__tests__/mobileOpportunityDetail.test.tsx

      - name: Install mobile dependencies
        working-directory: edutumobile
        run: npm ci

      - name: Format and lint affected files
        working-directory: edutumobile
        run: |
          npx eslint --fix "app/(app)/opportunities/[id].tsx" \
            components/opportunity/OpportunityApplicationSupportActions.tsx \
            __tests__/mobileOpportunityDetail.test.tsx
          npx eslint "app/(app)/opportunities/[id].tsx" \
            components/opportunity/OpportunityApplicationSupportActions.tsx \
            __tests__/mobileOpportunityDetail.test.tsx \
            --report-unused-disable-directives --max-warnings 0

      - name: Run focused opportunity-detail tests
        working-directory: edutumobile
        run: npm run test -- --runInBand __tests__/mobileOpportunityDetail.test.tsx

      - name: Run mobile typecheck
        working-directory: edutumobile
        run: npm run typecheck

      - name: Verify repository file budgets
        run: node scripts/check-large-file-budgets.mjs

      - name: Commit verified repair and remove temporary tooling
        run: |
          git rm .github/workflows/pr66-opportunity-detail-repair.yml
          git rm scripts/pr66-opportunity-detail-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "edutumobile/app/(app)/opportunities/[id].tsx" \
            edutumobile/components/opportunity/OpportunityApplicationSupportActions.tsx \
            edutumobile/__tests__/mobileOpportunityDetail.test.tsx
          git commit -m "fix: preserve opportunity support UX under governance"
          git push origin HEAD:agent/opportunity-content-ux
