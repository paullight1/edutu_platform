name: Community Phase 2 Review Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/community-phase2-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-community-parity-seo
          fetch-depth: 0

      - name: Stabilize web lifecycle and format mobile lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match in {path}, found {count}: {old[:100]!r}"
                  )
              target.write_text(text.replace(old, new, 1))

          web = "edutu-web-app/src/features/community/CommunityDmPage.tsx"
          replace_once(
              web,
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
          )
          replace_once(
              web,
              '  const [error, setError] = useState<string | null>(null);\n',
              '''  const [error, setError] = useState<string | null>(null);
            const conversationRef = useRef<DmConversationDetail | null>(null);
          ''',
          )
          replace_once(
              web,
              '''  useEffect(() => {
            setConversation(null);
            setMessages([]);''',
              '''  useEffect(() => {
            conversationRef.current = null;
            setConversation(null);
            setMessages([]);''',
          )
          replace_once(
              web,
              '''  }, [id, load]);

            useEffect(() => {
              const unsubscribe = subscribeToDmMessages''',
              '''  }, [id, load]);

            useEffect(() => {
              conversationRef.current = conversation;
            }, [conversation]);

            useEffect(() => {
              const unsubscribe = subscribeToDmMessages''',
          )
          replace_once(
              web,
              'const hydrated = hydrateRealtimeMessage(event, userId, conversation);',
              'const hydrated = hydrateRealtimeMessage(event, userId, conversationRef.current);',
          )
          replace_once(
              web,
              '''  }, [
            api,
            conversation?.otherUser.avatarUrl,
            conversation?.otherUser.displayName,
            conversation?.otherUser.userId,
            id,
            load,
            userId,
          ]);''',
              '''  }, [api, id, load, userId]);''',
          )

          mobile = "edutumobile/app/(app)/discussions/dm/[id].tsx"
          malformed = '''  useFocusEffect(
            useCallback(() => {
              let active = true;
              screenActiveRef.current = true;
              let reconciliationTimer: ReturnType<typeof setTimeout> | undefined;

              if (!conversationId) {
                void load();
                return () => {
                  active = false;
                  screenActiveRef.current = false;
                  loadRequestVersion.current += 1;
                };
              }

              const unsubscribe = subscribeToDmMessages(
                conversationId,
                (event) => {
                  if (
                    !active ||
                    !screenActiveRef.current ||
                    event.conversationId !== activeConversationIdRef.current
                  ) return;

                  const hydrated = hydrateRealtimeDmMessage(
                    event,
                    userId,
                    conversationRef.current,
                  );
                  setMessages((current) => mergeDmMessages(current, [hydrated]));
                  setConversation((current) =>
                    current ? { ...current, lastMessageAt: event.createdAt } : current,
                  );

                  if (
                    event.senderId !== userId &&
                    event.id !== lastMarkedMessageId.current
                  ) {
                    lastMarkedMessageId.current = event.id;
                    void markDmConversationRead(conversationId, getToken).catch(() => {
                      if (lastMarkedMessageId.current === event.id) {
                        lastMarkedMessageId.current = null;
                      }
                    });
                  }
                },
              );

              const reconcile = async () => {
                await load();
                if (active) {
                  reconciliationTimer = setTimeout(
                    () => void reconcile(),
                    RECONCILIATION_INTERVAL_MS,
                  );
                }
              };
              void reconcile();

              return () => {
                active = false;
                screenActiveRef.current = false;
                if (reconciliationTimer) clearTimeout(reconciliationTimer);
                unsubscribe();
                loadRequestVersion.current += 1;
              };
            }, [conversationId, getToken, load, userId]),
          );'''
          # The current source is semantically correct but its inner block lost
          # indentation during a guarded text transplant. Normalize only this
          # exact lifecycle block; no behavior changes.
          target = Path(mobile)
          text = target.read_text()
          start = text.find("  useFocusEffect(\n  useCallback(() => {")
          end_marker = "  }, [conversationId, getToken, load, userId]),\n);"
          if start < 0:
              raise SystemExit("Malformed mobile focus block start was not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Malformed mobile focus block end was not found")
          end += len(end_marker)
          target.write_text(text[:start] + malformed + text[end:])

          Path(".github/workflows/community-phase2-review-fixes.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(community): close phase 2 lifecycle review gaps"
          git push origin HEAD:feat/web-community-parity-seo
