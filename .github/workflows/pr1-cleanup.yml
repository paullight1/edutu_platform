name: PR 1 generated-artifact cleanup

on:
  push:
    branches:
      - feat/opportunity-pipeline-pr1
    paths:
      - .github/workflows/pr1-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'paullight1/edutu_platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/opportunity-pipeline-pr1
          fetch-depth: 0

      - name: Restore generated files and remove temporary bytecode
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            edutu-web-app/public/sitemap.xml \
            edutu-web-app/public/sitemaps/blog.xml \
            edutu-web-app/public/sitemaps/opportunities.xml \
            edutu-web-app/public/sitemaps/pages.xml
          rm -rf scripts/__pycache__
          rm .github/workflows/pr1-cleanup.yml

      - name: Verify cleanup and push
        shell: bash
        run: |
          git diff --exit-code origin/main -- \
            edutu-web-app/public/sitemap.xml \
            edutu-web-app/public/sitemaps/blog.xml \
            edutu-web-app/public/sitemaps/opportunities.xml \
            edutu-web-app/public/sitemaps/pages.xml
          test -z "$(find scripts -type f -name '*.pyc' -print)"
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove generated PR 1 artifacts"
          git push origin HEAD:feat/opportunity-pipeline-pr1
