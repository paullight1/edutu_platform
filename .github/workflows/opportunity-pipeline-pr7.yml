name: Opportunity Pipeline PR 7 Web Experience

on:
  pull_request:
    paths:
      - ".github/workflows/opportunity-pipeline-pr7.yml"
      - "edutu-web-app/src/App.tsx"
      - "edutu-web-app/src/components/Dashboard.tsx"
      - "edutu-web-app/src/components/MyPathPage.tsx"
      - "edutu-web-app/src/components/OpportunityDetailWithJourney.tsx"
      - "edutu-web-app/src/components/opportunity-path/**"
      - "edutu-web-app/src/services/opportunityJourneySignals.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opportunity-pipeline-pr7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-experience:
    name: Focused Home + My Path + Detail
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: edutu-web-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source SHA
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edutu-web-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Validate PWA output
        working-directory: .
        run: node scripts/validate-pwa-build.mjs edutu-web-app/dist
