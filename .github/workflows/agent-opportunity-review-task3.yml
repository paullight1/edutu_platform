name: Agent Opportunity Review Task 3

on:
  push:
    branches: [agent/opportunity-ai-review]
    paths:
      - ".agent/opportunity-review-task3.py"
      - ".github/workflows/agent-opportunity-review-task3.yml"

permissions:
  contents: write

concurrency:
  group: agent-opportunity-review-task3
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opportunity-ai-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/services/services/api/package-lock.json

      - name: Apply structured-content implementation patch
        run: python .agent/opportunity-review-task3.py

      - name: Install backend dependencies
        working-directory: backend/services/services/api
        run: npm ci

      - name: Format touched files
        working-directory: backend/services/services/api
        run: |
          npx prettier --write \
            src/opportunities/opportunity-metadata-merge.ts \
            src/opportunities/opportunity-metadata-merge.spec.ts \
            src/opportunities/public-opportunity-projection.ts \
            src/opportunities/public-opportunity-projection.spec.ts \
            src/opportunities/dto/create-opportunity.dto.ts \
            src/opportunities/opportunities.service.ts

      - name: Run focused Task 3 tests
        working-directory: backend/services/services/api
        run: npm test -- --runInBand opportunity-metadata-merge public-opportunity-projection

      - name: Run full backend tests
        working-directory: backend/services/services/api
        run: npm test -- --runInBand

      - name: Run backend lint
        working-directory: backend/services/services/api
        run: npm run lint

      - name: Build backend
        working-directory: backend/services/services/api
        run: npm run build

      - name: Remove temporary patch machinery
        run: |
          rm -f .agent/opportunity-review-task3.py
          rm -f .github/workflows/agent-opportunity-review-task3.yml
          rmdir .agent 2>/dev/null || true

      - name: Commit verified implementation
        run: |
          git config user.name "Edutu Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(opportunities): preserve and project structured content"
          git push origin HEAD:agent/opportunity-ai-review
