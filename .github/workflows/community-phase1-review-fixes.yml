name: Community Phase 1 Review Fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/community-phase1-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-community-parity-seo
          fetch-depth: 0

      - name: Wire deep links and workspace identity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match in {path}, found {count}: {old[:100]!r}"
                  )
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "edutu-web-app/src/App.tsx",
              '''const CommunityAppRouter = lazy(
            () => import("./features/community/CommunityAppRouter"),
          );''',
              '''const CommunityAppRouter = lazy(
            () => import("./features/community/CommunityAppRouter"),
          );
          const CommunityDeepLinkRedirect = lazy(
            () => import("./features/community/CommunityDeepLinkRedirect"),
          );''',
          )

          replace_once(
              "edutu-web-app/src/App.tsx",
              '      <Route path="/community/*" element={<CommunityPage />} />',
              '''      <Route
                path="/discussions/*"
                element={
                  <ProtectedRoute>
                    <CommunityDeepLinkRedirect />
                  </ProtectedRoute>
                }
              />
              <Route path="/community/*" element={<CommunityPage />} />''',
          )

          replace_once(
              "edutu-web-app/src/components/AppWorkspaceShell.tsx",
              '''  UserCheck,
            X,''',
              '''  UserCheck,
            UsersRound,
            X,''',
          )

          replace_once(
              "edutu-web-app/src/components/AppWorkspaceShell.tsx",
              '''  opportunities: Briefcase,
            deadlines: Calendar,''',
              '''  opportunities: Briefcase,
            community: UsersRound,
            deadlines: Calendar,''',
          )

          replace_once(
              "edutu-web-app/src/components/AppWorkspaceShell.tsx",
              '''  if (pathname.startsWith("/app/opportunities")) return "navigation.opportunities";
            if (pathname.startsWith("/app/deadlines") || pathname === "/deadlines") return "navigation.deadlines";''',
              '''  if (pathname.startsWith("/app/opportunities")) return "navigation.opportunities";
            if (pathname.startsWith("/app/community")) return "navigation.community";
            if (pathname.startsWith("/app/deadlines") || pathname === "/deadlines") return "navigation.deadlines";''',
          )

          translations = {
              "en": "Community",
              "es": "Comunidad",
              "fr": "Communauté",
              "de": "Gemeinschaft",
              "zh": "社群",
              "ar": "المجتمع",
          }
          locale_root = Path("edutu-web-app/src/i18n/locales")
          for language, value in translations.items():
              path = locale_root / f"{language}.json"
              payload = json.loads(path.read_text())
              navigation = payload.get("navigation")
              if not isinstance(navigation, dict):
                  raise SystemExit(f"Missing navigation object in {path}")
              navigation["community"] = value
              path.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=4) + "\n"
              )

          Path(".github/workflows/community-phase1-review-fixes.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(community): close phase 1 review gaps"
          git push origin HEAD:feat/web-community-parity-seo
