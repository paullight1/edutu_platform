name: Security Audit Contract

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/security-audit-contract.yml"
      - "scripts/check-mobile-audit.mjs"
      - "scripts/check-security-audits.mjs"
      - "scripts/security-audit.mjs"
      - "scripts/security-audit.test.mjs"
      - "scripts/security-lockfile-versions.test.mjs"
      - "backend/services/services/api/package-lock.json"
      - "admin/package-lock.json"
      - "edutu-web-app/package-lock.json"
      - "edutumobile/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Security Audit Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/security-audit.test.mjs

  inventory:
    name: Workspace Security Audit Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-security-audits.mjs
