# Include inside the www.edutu.org server block. Send both people and crawlers
# to the same public SEO renderer; it injects content into the bootable SPA.
# Keep /index.html and /assets/ served by the frontend so shell fetching cannot
# recurse. Preserve upstream 404/503 responses rather than returning the home
# page for missing listings or backend failures.
location ^~ /opportunity/ {
  proxy_pass https://backend.edutu.org/seo/opportunity/;
  proxy_ssl_server_name on;
  proxy_ssl_name backend.edutu.org;
  proxy_set_header Host backend.edutu.org;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
}
