[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Production Clerk publishable key (public by design — it ships in every
  # browser bundle). Instance: clerk.edutu.org. NOTE: verified 2026-07-16 that
  # the Netlify DASHBOARD env var takes precedence over this value, so the
  # real enforcement lives in src/main.tsx (production guard rejects pk_test).
  # This stays as documentation and as the fallback once the stale pk_test
  # dashboard variable (dev instance calm-gecko-44) is deleted.
  VITE_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuZWR1dHUub3JnJA"
  SECRETS_SCAN_OMIT_KEYS = '["VITE_FIREBASE_API_KEY","VITE_FIREBASE_APP_ID","VITE_FIREBASE_AUTH_DOMAIN","VITE_FIREBASE_MEASUREMENT_ID","VITE_FIREBASE_MESSAGING_SENDER_ID","VITE_FIREBASE_PROJECT_ID","VITE_FIREBASE_STORAGE_BUCKET","VITE_OPENROUTER_API_KEY"]'
  SECRETS_SCAN_OMIT_PATHS = '["dist/**"]'

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# Proxy the dynamic sitemap/robots from the backend (edutu-platform), which
# lists every opportunity URL. The previous host (edutu-api.onrender.com) 404s,
# which silently starved Google of the opportunity sitemap.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://edutu-platform.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://edutu-platform.onrender.com/robots.txt"
  status = 200
  force = true

# Inject per-opportunity Open Graph tags so shared /opportunity/:id links unfurl
# with the branded share-card image + real title/description (SPA HTML alone
# only carries the generic default OG image).
[[edge_functions]]
  path = "/opportunity/*"
  function = "opportunity-og"

# Same idea for the opportunities LIST page and its ?category= collection
# variants — static crawler-time title/description/OG (no backend fetch).
[[edge_functions]]
  path = "/opportunities"
  function = "opportunities-og"

# Public community summaries are safe anonymous projections. Inject their real
# names/descriptions before crawlers see the SPA shell; private/unavailable
# slugs receive noindex from the edge function.
[[edge_functions]]
  path = "/community/groups/*"
  function = "community-group-og"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
