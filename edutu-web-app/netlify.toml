[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = '["VITE_FIREBASE_API_KEY","VITE_FIREBASE_APP_ID","VITE_FIREBASE_AUTH_DOMAIN","VITE_FIREBASE_MEASUREMENT_ID","VITE_FIREBASE_MESSAGING_SENDER_ID","VITE_FIREBASE_PROJECT_ID","VITE_FIREBASE_STORAGE_BUCKET","VITE_OPENROUTER_API_KEY"]'
  SECRETS_SCAN_OMIT_PATHS = '["dist/**"]'

[[redirects]]
  from = "/sitemap.xml"
  to = "https://edutu-api.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://edutu-api.onrender.com/robots.txt"
  status = 200
  force = true

# Inject per-opportunity Open Graph tags so shared /opportunity/:id links unfurl
# with the branded share-card image + real title/description (SPA HTML alone
# only carries the generic default OG image).
[[edge_functions]]
  path = "/opportunity/*"
  function = "opportunity-og"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
