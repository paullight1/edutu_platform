<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />

    <!-- Apply the saved theme (mode + accent pack) before first paint to avoid
         a flash of the wrong theme. Mirrors src/hooks/useTheme.tsx. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode =
            localStorage.getItem('edutu-theme-mode') ||
            localStorage.getItem('edutu-theme') ||
            'system';
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (mode === 'system' && prefersDark)) {
            root.classList.add('dark');
          }
          var pack = localStorage.getItem('edutu-theme-pack');
          if (pack && pack !== 'indigo') {
            root.setAttribute('data-theme', pack);
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#146ef5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Edutu" />
    <meta name="application-name" content="Edutu" />
    <meta name="msapplication-TileColor" content="#146ef5" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- SEO Meta Tags -->
    <title>Edutu | AI-powered global opportunities</title>
    <meta

    />

      content="scholarships, internships, grants, fellowships, global opportunities, AI roadmap, application deadlines, Edutu"
    />
    <meta name="author" content="Edutu Team" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.edutu.org/" />

    <!-- Open Graph / Social Media -->

    <meta property="og:url" content="https://www.edutu.org/" />
    <meta
      property="og:title"
      content="Edutu | AI-powered global opportunities"
    />
    <meta
      property="og:description"
      content="Find scholarships, fellowships, internships, grants, and global programs with AI-guided roadmaps, reminders, and application tracking."
    />
    <meta
      property="og:image"
      content="https://www.edutu.org/icons/icon-512x512.png"
    />
    <meta property="og:image:alt" content="Edutu logo" />
    <meta property="og:site_name" content="Edutu" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Edutu | AI-powered global opportunities"
    />
    <meta
      name="twitter:description"
      content="Find scholarships, fellowships, internships, grants, and global programs with AI-guided roadmaps, reminders, and application tracking."
    />
    <meta
      name="twitter:image"
      content="https://www.edutu.org/icons/icon-512x512.png"
    />

    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192x192.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest - auto-injected by vite-plugin-pwa -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Warm the API + banner-image origins so first data/image requests skip DNS+TLS setup -->
    <link rel="preconnect" href="https://edutu-platform.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <!-- Loaded here rather than via @import in index.css so the preload
         scanner finds them immediately.

         Variable axes, not static instances: the weight scale in
         tailwind.config.js renders at 560/640, which only resolves correctly
         against a variable file. Requesting ranges also collapses what used to
         be ten separate weight files (six Outfit + four Mono) into three.
         Instrument Sans carries UI/body; Outfit is display-only now, so its
         800/900 masters are gone. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Edutu",
        "url": "https://www.edutu.org/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Edutu helps learners find global opportunities and turn them into AI-guided application roadmaps.",
        "publisher": {
          "@type": "Organization",
          "name": "Edutu",
          "url": "https://www.edutu.org/",
          "logo": "https://www.edutu.org/icons/icon-512x512.png"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
