services:
  - type: web
    name: edutu-api
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Keep the catalog fresh for paying API customers. The scheduler runs the
      # daily scrape (cron configured in scraper_config); verification re-checks
      # opportunity links and marks broken ones. Both were off — stale data is a
      # refund risk for the paid API.
      - key: SCRAPER_SCHEDULER_ENABLED
        value: "true"
      - key: OPPORTUNITY_VERIFICATION_ENABLED
        value: "true"
      # Keep the internal Edge-to-Render egress endpoint closed until its
      # signed caller and exact source-host allowlist are configured.
      - key: SCRAPE_EGRESS_ENABLED
        value: "false"
      - key: SCRAPE_EGRESS_SHARED_SECRET
        sync: false
      - key: SCRAPE_EGRESS_ALLOWED_HOSTS
        sync: false
      - key: SCRAPE_EGRESS_TIMEOUT_MS
        value: "10000"
      - key: SCRAPE_EGRESS_MAX_RESPONSE_BYTES
        value: "1000000"
      - key: SCRAPE_EGRESS_MAX_REDIRECTS
        value: "3"
      - key: SCRAPE_EGRESS_SIGNATURE_MAX_AGE_SECONDS
        value: "300"
      - key: SCRAPE_EGRESS_MAX_REQUEST_BYTES
        value: "4096"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER_URL
        value: https://clerk.edutu.org
      - key: API_KEY_PEPPER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Bachs checkout stays fail-closed until provider access, signed webhook
      # details, shell secret, schema migrations, and catalog mappings are ready.
      - key: BACHS_CHECKOUT_ENABLED
        value: "false"
      - key: BACHS_ENVIRONMENT
        value: sandbox
      - key: BACHS_API_BASE_URL
        value: https://sandbox-api.bachs.io
      - key: BACHS_API_KEY
        sync: false
      - key: BACHS_WEBHOOK_ENABLED
        value: "false"
      - key: BACHS_WEBHOOK_SECRET
        sync: false
      - key: BACHS_EXPECTED_ORGANIZATION_ID
        sync: false
      # Developer API credit products are separate from the database-managed
      # learner plan catalog; both JSON values are provider-specific.
      - key: BACHS_PRODUCT_MAPPINGS
        sync: false
      - key: BACHS_PRODUCT_CATALOG
        sync: false
      - key: BILLING_PAY_SHELL_ENABLED
        value: "false"
      - key: BILLING_PAY_SHELL_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_KEY_ENCRYPTION_SECRET
        sync: false
      - key: EDUTU_PUBLIC_APP_URL
        value: https://www.edutu.org
      - key: FRONTEND_URL
        value: https://www.edutu.org
      - key: ADMIN_URL
        value: https://admin.edutu.org
      - key: MOBILE_APP_URL
        sync: false
